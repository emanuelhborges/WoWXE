name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag, e.g. v1.3.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python packages
        run: python -m pip install -r companion/requirements.txt lupa pyinstaller

      - name: Run tests
        run: python tests/test_pipeline.py

      - name: Package the iCUE widget
        shell: pwsh
        run: |
          npm install -g icuewidget-cli@0.5.1
          icuewidget package widget
          Move-Item -Force wowxe.icuewidget WoWXE.icuewidget

      - name: Build WoWXE.exe
        run: >
          pyinstaller --noconfirm --windowed --name WoWXE --icon assets/wowxe.ico
          --paths companion --hidden-import wowxe_companion --hidden-import casc --hidden-import pystray._win32
          WoWXE.pyw

      - name: Smoke test WoWXE.exe (companion mode answers on its port)
        shell: pwsh
        run: |
          $p = Start-Process dist/WoWXE/WoWXE.exe -ArgumentList "--companion","--port","8799","--cache","$env:RUNNER_TEMP\wowxe-cache" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/state.json -TimeoutSec 2; $ok = $true; break } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "WoWXE.exe --companion did not answer on port 8799" }
          "companion version: $($r.versions.companion)  status: $($r.status)"
          if (-not $r.versions.companion) { throw "no version in state.json" }

      - name: Assemble the download
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          $dst = "dist/WoWXE"
          Copy-Item -Recurse addon "$dst/addon"
          Copy-Item -Recurse assets "$dst/assets"
          Copy-Item WoWXE.icuewidget, README.md, LICENSE.md, CHANGELOG.md $dst
          $tag = if ($env:RELEASE_INPUT) { $env:RELEASE_INPUT } elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "" }
          $name = if ($tag) { "WoWXE-$tag" } else { "WoWXE-dev" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Compress-Archive -Path $dst -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: WoWXE-windows
          path: ${{ env.ZIP }}

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: WoWXE ${{ env.TAG }}
          files: |
            ${{ env.ZIP }}
            WoWXE.icuewidget
          body: |
            **Download `WoWXE-${{ env.TAG }}.zip`**, unzip it anywhere, run **WoWXE.exe** (it offers to install the addon),
            click **Start**, then import **WoWXE.icuewidget** in iCUE (size XL). WoW must run in Windowed (Fullscreen) mode.
            See the [README](https://github.com/${{ github.repository }}#readme) and [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          generate_release_notes: true
